<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Star of Bethlehem International School — Raising Purposeful Leaders Through Quality Education. A premier international school in Ghana offering Creche through JHS."
    />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#0b3d2e" />
    <title>Star of Bethlehem International School</title>

    <!--
      SITE_URL is a placeholder — this project has no production domain yet.
      Before deploying, replace every "https://YOUR-DOMAIN-HERE.com" below
      (canonical + Open Graph + Twitter) with the real one, and re-upload
      og-image.jpg to that domain's /public root if it moves.
    -->
    <link rel="canonical" href="https://YOUR-DOMAIN-HERE.com/" />

    <!-- Open Graph (Facebook, WhatsApp, LinkedIn, etc.) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Star of Bethlehem International School" />
    <meta property="og:locale" content="en_GH" />
    <meta property="og:url" content="https://YOUR-DOMAIN-HERE.com/" />
    <meta property="og:title" content="Star of Bethlehem International School" />
    <meta
      property="og:description"
      content="Raising Purposeful Leaders Through Quality Education. A premier international school in Ghana offering Creche through JHS."
    />
    <meta property="og:image" content="https://YOUR-DOMAIN-HERE.com/og-image.jpg" />
    <meta property="og:image:width" content="1080" />
    <meta property="og:image:height" content="719" />
    <meta property="og:image:alt" content="Students celebrating at Star of Bethlehem International School" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Star of Bethlehem International School" />
    <meta
      name="twitter:description"
      content="Raising Purposeful Leaders Through Quality Education. A premier international school in Ghana offering Creche through JHS."
    />
    <meta name="twitter:image" content="https://YOUR-DOMAIN-HERE.com/og-image.jpg" />
    <script>
      // Set the theme before first paint so there's no flash of the wrong
      // theme. Kept as a tiny inline script (not a React effect) precisely
      // so it runs before anything renders.
      (function () {
        try {
          var stored = localStorage.getItem("theme");
          var theme =
            stored === "light" || stored === "dark"
              ? stored
              : window.matchMedia("(prefers-color-scheme: dark)").matches
                ? "dark"
                : "light";
          document.documentElement.setAttribute("data-theme", theme);
        } catch (e) {
          /* localStorage/matchMedia unavailable — default light styles apply */
        }
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500&family=Inter:wght@300;400;500;600;700&display=swap"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
